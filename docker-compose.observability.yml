# =============================================================================
# IFRS9 IAF — Observability Stack
# =============================================================================
# Services: otel-collector, tempo, loki, grafana, prometheus
# Network: ifrs9-observability
#
# Usage:
#   docker compose -f docker-compose.observability.yml up -d
#   Open Grafana at http://localhost:3000 (admin/admin)
#
# To connect existing app containers, they must be on the same network:
#   docker network connect ifrs9-observability <container_name>
# =============================================================================

networks:
  ifrs9-observability:
    name: ifrs9-observability
    driver: bridge
    # NOTE: The `name:` prefix is required so that Docker Compose does not
    # auto-prefix this network with the project directory name. The main
    # compose file (docker-compose.yml in production) references this network
    # as `external: true`, expecting the exact name `ifrs9-observability`.
    #
    # If the network already exists from a prior run, set `external: true`
    # instead of `driver: bridge` to adopt it without recreating.

services:
  # ===========================================================================
  # OpenTelemetry Collector — receives traces from frontend & backend
  # ===========================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.154.0
    container_name: otel-collector
    command:
      - --config=/etc/otelcol/otel-collector.yml
    volumes:
      - ./ops/observability/otel-collector.yml:/etc/otelcol/otel-collector.yml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - ifrs9-observability
    restart: unless-stopped

  # ===========================================================================
  # Tempo — distributed tracing store
  # ===========================================================================
  tempo:
    image: grafana/tempo:2.10.7
    container_name: tempo
    command: [ "-config.file=/etc/tempo/tempo.yml" ]
    volumes:
      - ./ops/observability/tempo.yml:/etc/tempo/tempo.yml
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP (API + UI)
    networks:
      - ifrs9-observability
    restart: unless-stopped

  # ===========================================================================
  # Loki — log aggregation
  # ===========================================================================
  loki:
    image: grafana/loki:3.7.2
    container_name: loki
    command: [ "-config.file=/etc/loki/loki.yml" ]
    volumes:
      - ./ops/observability/loki.yml:/etc/loki/loki.yml
      - loki-data:/var/loki
    ports:
      - "3100:3100"
    networks:
      - ifrs9-observability
    restart: unless-stopped

  # ===========================================================================
  # Prometheus — metrics storage (also receives from otel-collector)
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --web.enable-lifecycle
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - ifrs9-observability
    restart: unless-stopped

  # ===========================================================================
  # Grafana — unified dashboard for traces, logs, and metrics
  # ===========================================================================
  grafana:
    image: grafana/grafana:13.0.2
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./ops/observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./ops/observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - ifrs9-observability
    restart: unless-stopped

volumes:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
