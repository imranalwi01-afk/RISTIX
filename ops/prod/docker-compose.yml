version: "3.8"

services:
  # ============================================================================
  # 🗄️ POSTGRES (OPTIONAL – local / fallback only)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ifrs9-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ifrspro_platform_admin}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    networks:
      - ifrs9-prod
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [ "db", "full" ]

  # ============================================================================
  # 📊 REDIS (OPTIONAL – local / fallback only)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ifrs9-redis-prod
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis-prod-data:/data
    networks:
      - ifrs9-prod
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [ "db", "full" ]

  # ============================================================================
  # 🚀 BACKEND (PRODUCTION IMAGE)
  # ============================================================================
  backend:
    image: ghcr.io/ifrspro/ifrs9-iaf/backend:production
    container_name: ifrs9-backend-prod
    restart: always
    env_file:
      - ./env/backend.env
    ports:
      - "4232:4232"
    networks:
      - ifrs9-prod
    profiles: [ "app", "full" ]

  # ============================================================================
  # 🌐 FRONTEND (PRODUCTION IMAGE)
  # ============================================================================
  frontend:
    image: ghcr.io/ifrspro/ifrs9-iaf/frontend:production
    container_name: ifrs9-frontend-prod
    restart: always
    env_file:
      - ./env/frontend.env
    ports:
      - "4231:4231"
    networks:
      - ifrs9-prod
    depends_on:
      - backend
    profiles: [ "app", "full" ]

  # ============================================================================
  # 📈 R ANALYTICS (PRODUCTION IMAGE)
  # ============================================================================
  r-analytics:
    build:
      context: ../../packages/r-analytics
      dockerfile: Dockerfile
    image: ghcr.io/ifrspro/ifrs9-iaf/r-analytics:production
    container_name: ifrs9-r-analytics-prod
    restart: always
    env_file:
      - ./env/r-analytics.env
    ports:
      - "4236:3838"
      - "4241:4241"
    networks:
      - ifrs9-prod
    profiles: [ "analytics", "full" ]

# ============================================================================
# 📁 VOLUMES
# ============================================================================
volumes:
  postgres-prod-data:
  redis-prod-data:

    # ============================================================================
    # 🌐 NETWORKS
    # ============================================================================
networks:
  ifrs9-prod:
    driver: bridge
