version: "3.8"

services:
  # ============================================================================
  # 🗄️ POSTGRES (OPTIONAL – local / fallback only)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ristix-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ifrspro_platform_admin}
    ports:
      - "5432:5432"
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    networks:
      - ristix-prod
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [ "db", "full" ]

  # ============================================================================
  # 📊 REDIS (OPTIONAL – local / fallback only)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ristix-redis-prod
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis-prod-data:/data
    networks:
      - ristix-prod
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [ "db", "full" ]

  # ============================================================================
  # 🚀 BACKEND (PRODUCTION IMAGE)
  # ============================================================================
  backend:
    image: ghcr.io/imranalwi01-afk/ristix/backend:production
    container_name: ristix-backend-prod
    restart: always
    env_file:
      - ./env/backend.env
    ports:
      - "4232:4232"
    networks:
      ristix-prod:
        aliases:
          - new-backend
    profiles: [ "app", "full" ]

  # ============================================================================
  # 🌐 FRONTEND (PRODUCTION IMAGE)
  # ============================================================================
  frontend:
    image: ghcr.io/imranalwi01-afk/ristix/frontend:production
    container_name: ristix-frontend-prod
    restart: always
    env_file:
      - ./env/frontend.env
    environment:
      HOSTNAME: "0.0.0.0"
    ports:
      - "4231:4231"
    healthcheck:
      # Fix: use 127.0.0.1 explicitly — 'localhost' resolves to [::1] (IPv6)
      # but Next.js only listens on 0.0.0.0 (IPv4), causing 771+ consecutive failures
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4231/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ristix-prod
    depends_on:
      - backend
    profiles: [ "app", "full" ]

  # ============================================================================
  # 📈 R ANALYTICS (PRODUCTION IMAGE)
  # ============================================================================
  r-analytics:
    build:
      context: ../../packages/r-analytics
      dockerfile: Dockerfile
    image: ghcr.io/imranalwi01-afk/ristix/r-analytics:production
    container_name: ristix-r-analytics-prod
    restart: always
    env_file:
      - ./env/r-analytics.env
    environment:
      # Ensure R Analytics connects to host PostgreSQL at 172.25.0.25:5432
      LEGACY_DB_HOST: "172.25.0.25"
      LEGACY_DB_PORT: "5432"
      FRS9_DB_HOST: "172.25.0.25"
      FRS9_DB_PORT: "5432"
      DB_HOST: "172.25.0.25"
      DB_PORT: "5432"
    extra_hosts:
      # Allow container to reach host machine at 172.25.0.25 (PostgreSQL port 5432)
      - "host.docker.internal:172.25.0.25"
    ports:
      - "4236:4236"
      - "4241:4241"
    healthcheck:
      # Use 127.0.0.1 to avoid IPv6 resolution issues
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4236/ >/dev/null && curl -fsS http://127.0.0.1:4241/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ristix-prod
    profiles: [ "analytics", "full" ]

# ============================================================================
# 📁 VOLUMES
# ============================================================================
volumes:
  postgres-prod-data:
    name: ifrs9_postgres-prod-data
    external: true
  redis-prod-data:
    name: ifrs9_redis-prod-data
    external: true

    # ============================================================================
    # 🌐 NETWORKS
    # ============================================================================
networks:
  ristix-prod:
    driver: bridge
