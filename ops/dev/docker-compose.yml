# docker-compose.yml (Development Server)
# ============================================================================
# 🚀 IFRS9 DEVELOPMENT SERVER DEPLOYMENT
# ============================================================================
# For deploying to a development/staging server environment
# - Uses development mode but with restart policies
# - Includes hot reload for faster iteration
# - Suitable for shared dev/staging environments
# ============================================================================

version: '3.8'

services:
  # ============================================================================
  # 🗄️ POSTGRESQL DATABASE (Development Server)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ifrs9-postgres-dev-server
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ifrspro_platform_admin}
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - ifrs9-dev
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - db
      - full

  # ============================================================================
  # 📊 REDIS (Development Server)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ifrs9-redis-dev-server
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    networks:
      - ifrs9-dev
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - db
      - full

  # ============================================================================
  # 🚀 NEW BACKEND SERVICE (Development Server)
  # ============================================================================
  new-backend:
    build:
      context: ../../packages/new-backend
      dockerfile: Dockerfile
      target: builder
    container_name: ifrs9-new-backend-dev-server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4232
      HOST: 0.0.0.0

      # Database Configuration
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}

      # Platform Database
      PLATFORM_DB_HOST: ${PLATFORM_DB_HOST:-postgres}
      PLATFORM_DB_PORT: ${PLATFORM_DB_PORT:-5432}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER:-postgres}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-postgres}
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME:-ifrspro_platform_admin}
      PLATFORM_DB_SSL: ${PLATFORM_DB_SSL:-false}

      # Shared Services Database
      SHARED_DB_HOST: ${SHARED_DB_HOST:-postgres}
      SHARED_DB_PORT: ${SHARED_DB_PORT:-5432}
      SHARED_DB_USER: ${SHARED_DB_USER:-postgres}
      SHARED_DB_PASSWORD: ${SHARED_DB_PASSWORD:-postgres}
      SHARED_DB_NAME: ${SHARED_DB_NAME:-ifrspro_shared_services}
      SHARED_DB_SSL: ${SHARED_DB_SSL:-false}

      # Tenant Database
      TENANT_DB_HOST: ${TENANT_DB_HOST:-postgres}
      TENANT_DB_PORT: ${TENANT_DB_PORT:-5432}
      TENANT_DB_USER: ${TENANT_DB_USER:-postgres}
      TENANT_DB_PASSWORD: ${TENANT_DB_PASSWORD:-postgres}
      TENANT_DB_NAME: ${TENANT_DB_NAME:-ifrspro_tenant_iaf}
      TENANT_DB_SSL: ${TENANT_DB_SSL:-false}

      # Legacy Database
      LEGACY_DB_HOST: ${LEGACY_DB_HOST}
      LEGACY_DB_PORT: ${LEGACY_DB_PORT:-5433}
      LEGACY_DB_USER: ${LEGACY_DB_USER:-postgres}
      LEGACY_DB_PASSWORD: ${LEGACY_DB_PASSWORD:-postgres}
      LEGACY_DB_NAME: ${LEGACY_DB_NAME:-FRS9PRO}
      LEGACY_DB_SSL: ${LEGACY_DB_SSL:-false}

      # Backward compatibility - Primary DB URL (points to Platform DB)
      DATABASE_URL: ${DATABASE_URL:-postgresql://${PLATFORM_DB_USER:-postgres}:${PLATFORM_DB_PASSWORD:-postgres}@${PLATFORM_DB_HOST:-postgres}:${PLATFORM_DB_PORT:-5432}/${PLATFORM_DB_NAME:-ifrspro_platform_admin}}
      LEGACY_DATABASE_URL: ${LEGACY_DATABASE_URL:-postgresql://${LEGACY_DB_USER:-postgres}:${LEGACY_DB_PASSWORD:-postgres}@${LEGACY_DB_HOST}:${LEGACY_DB_PORT:-5433}/${LEGACY_DB_NAME:-FRS9PRO}}

      # Tenant Configuration
      TENANT_ID: ${TENANT_ID:-iaf}
      TENANT_NAME: ${TENANT_NAME:-Indonesia Airawata Finance}
      TENANT_SLUG: ${TENANT_SLUG:-iaf}
      COMPANY_NAME: ${COMPANY_NAME:-Indonesia Airawata Finance}
      BANKING_TYPE: ${BANKING_TYPE:-conventional}
      SINGLE_TENANT_MODE: ${SINGLE_TENANT_MODE:-true}

      # URLs
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      API_BASE_URL: ${API_BASE_URL}
      RAPI_BASE_URL: ${RAPI_BASE_URL}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}

      # Redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "4232:4232"
    networks:
      - ifrs9-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://localhost:4232/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
    command: [ "bun", "run", "dev" ]
    profiles:
      - app
      - full

  # ============================================================================
  # 🌐 FRONTEND SERVICE (Development Server - Production Build)
  # ============================================================================
  frontend:
    build:
      context: ../../packages/frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${API_BASE_URL}
        - NEXT_PUBLIC_R_API_URL=${RAPI_BASE_URL}
        - NEXT_PUBLIC_R_ANALYTICS_URL=${R_DASHBOARD_URL}
        - NEXT_PUBLIC_ENVIRONMENT=development
    container_name: ifrs9-frontend-dev-server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4231
      HOSTNAME: "0.0.0.0"

      # Public URLs
      NEXT_PUBLIC_API_URL: ${API_BASE_URL}
      NEXT_PUBLIC_BACKEND_API_URL: ${API_BASE_URL}
      NEXT_PUBLIC_R_API_URL: ${RAPI_BASE_URL}
      NEXT_PUBLIC_R_ANALYTICS_URL: ${R_DASHBOARD_URL}
      NEXT_PUBLIC_DOMAIN: ifrspro.id
    ports:
      - "4231:4231"
    networks:
      - ifrs9-dev
    depends_on:
      - new-backend
    profiles:
      - app
      - full

# ============================================================================
# 📁 VOLUMES
# ============================================================================
volumes:
  postgres-dev-data:
    driver: local
  redis-dev-data:
    driver: local

# ============================================================================
# 🌐 NETWORKS
# ============================================================================
networks:
  ifrs9-dev:
    driver: bridge
