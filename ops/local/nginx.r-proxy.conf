server {
    listen 8080;
    
    add_header X-Frame-Options "" always;
    add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:5231 http://127.0.0.1:5231" always;

    location /api/ {
        proxy_pass http://172.25.0.25:4241/api/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://172.25.0.25:4236/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
