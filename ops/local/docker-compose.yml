# docker-compose.yml (Local Development)
# ============================================================================
# 🚀 IFRS9 NEW BACKEND - LOCAL DEVELOPMENT DOCKER COMPOSE
# ============================================================================
# Profiles:
#   - db: Run databases only (postgres + redis)
#   - app: Run application service logic (backend + optional frontend static)
#   - backend: Run backend only
#   - frontend / frontend-only / dev-frontend: Run frontend variants
#   - analytics: Run R analytics service only
#   - backend-remote-db: Run backend against external/remote databases using ops/local/backend.env
#   - frontend-remote-db: Run frontend against backend-remote-db flow
#   - full: Run all major services
# ============================================================================

version: '3.8'

services:
  # ============================================================================
  # 🗄️ POSTGRESQL DATABASE (Development)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ifrs9-postgres-dev
    restart: ${IFRS9_RESTART_POLICY:-no}
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ifrspro_platform_admin}
    ports:
      - "6432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - ifrs9-dev
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - db
      - bootstrap
      - full
      - dev
      - app
      - backend
      - backend-only
      - backend-legacy-vpn

  # ============================================================================
  # 🧰 POSTGRES INIT (Create required databases)
  # ============================================================================
  db-init:
    image: postgres:16-alpine
    container_name: ifrs9-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:-postgres}
    command: >
      sh -c "
        createdb -h postgres -p 5432 -U ${DB_USER:-postgres} ifrspro_tenant_iaf 2>/dev/null || true;
        createdb -h postgres -p 5432 -U ${DB_USER:-postgres} FRS9PRO 2>/dev/null || true;
        createdb -h postgres -p 5432 -U ${DB_USER:-postgres} ifrspro_shared_services 2>/dev/null || true;
      "
    networks:
      - ifrs9-dev
    profiles:
      - bootstrap
      - full
      - dev
      - app
      - backend
      - backend-only
      - backend-legacy-vpn

  # ============================================================================
  # 🧩 PLATFORM INIT (Create platform_admin schema + minimal tables)
  # ============================================================================
  platform-init:
    image: postgres:16-alpine
    container_name: ifrs9-platform-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:-postgres}
    command: >
      sh -c "
        psql -h postgres -p 5432 -U ${DB_USER:-postgres} -d ${PLATFORM_DB_NAME:-ifrspro_platform_admin} -v ON_ERROR_STOP=1 -c \"
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE SCHEMA IF NOT EXISTS platform_admin;

          CREATE TABLE IF NOT EXISTS platform_admin.tenants (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            code varchar(50) NOT NULL,
            name varchar(255) NOT NULL,
            slug varchar(100),
            description text,
            type varchar(50) DEFAULT 'banking',
            banking_mode varchar(20) DEFAULT 'conventional',
            settings text DEFAULT '{}'::text,
            is_active boolean NOT NULL DEFAULT true,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );

          CREATE UNIQUE INDEX IF NOT EXISTS platform_tenants_code_idx ON platform_admin.tenants (code);
          CREATE INDEX IF NOT EXISTS platform_tenants_slug_idx ON platform_admin.tenants (slug);
          CREATE INDEX IF NOT EXISTS platform_tenants_active_idx ON platform_admin.tenants (is_active);

          CREATE TABLE IF NOT EXISTS platform_admin.settings (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            key varchar(100) NOT NULL UNIQUE,
            value jsonb NOT NULL DEFAULT '{}'::jsonb,
            description text,
            updated_at timestamptz NOT NULL DEFAULT now()
          );

          CREATE UNIQUE INDEX IF NOT EXISTS platform_settings_key_idx ON platform_admin.settings (key);

          CREATE TABLE IF NOT EXISTS platform_admin.users (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            username varchar(100) NOT NULL,
            email varchar(255) NOT NULL,
            password_hash varchar(255) NOT NULL,
            full_name varchar(200) NOT NULL,
            employee_id varchar(50),
            role varchar(100) NOT NULL,
            is_active boolean DEFAULT true,
            last_login_at timestamptz,
            failed_login_attempts integer DEFAULT 0,
            created_at timestamptz DEFAULT now(),
            updated_at timestamptz DEFAULT now(),
            user_role varchar(100),
            tenant_id uuid,
            tenant_name varchar(255)
          );

          CREATE INDEX IF NOT EXISTS idx_users_role ON platform_admin.users (role);
          CREATE INDEX IF NOT EXISTS idx_users_last_login ON platform_admin.users (last_login_at);
          CREATE INDEX IF NOT EXISTS idx_users_is_active ON platform_admin.users (is_active);

          INSERT INTO platform_admin.tenants (id, code, name, slug, description, banking_mode, is_active)
          VALUES (
            'f7b3a087-8a42-40c4-baca-9dc92cc0a2be'::uuid,
            'IAF',
            'Indonesia Airawata Finance',
            'iaf',
            'Implementation Tenant for IAF',
            'dual',
            true
          )
          ON CONFLICT (id) DO NOTHING;
        \";
      "
    networks:
      - ifrs9-dev
    profiles:
      - bootstrap
      - full
      - dev
      - app
      - backend
      - backend-only
      - backend-legacy-vpn

  # ============================================================================
  # 🧩 TENANT MIGRATE (Apply Drizzle migrations to tenant DB)
  # ============================================================================
  tenant-migrate:
    build:
      context: ../../packages/new-backend
      dockerfile: Dockerfile
      target: builder
    container_name: ifrs9-tenant-migrate
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${TENANT_DB_NAME:-ifrspro_tenant_iaf}
    command: sh -c "bun run db:migrate"
    networks:
      - ifrs9-dev
    profiles:
      - bootstrap
      - full
      - dev
      - app
      - backend
      - backend-only
      - backend-legacy-vpn

  # ============================================================================
  # 🧩 TENANT SEED (Create default tenant roles/users for login)
  # ============================================================================
  tenant-seed:
    image: postgres:16-alpine
    container_name: ifrs9-tenant-seed
    depends_on:
      tenant-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - ../../packages/new-backend/src/db/seeds:/seeds:ro
    command: >
      sh -c "
        psql -h postgres -p 5432 -U ${DB_USER:-postgres} -d ${TENANT_DB_NAME:-ifrspro_tenant_iaf} -v ON_ERROR_STOP=1 -f /seeds/001_seed_roles.sql;
        psql -h postgres -p 5432 -U ${DB_USER:-postgres} -d ${TENANT_DB_NAME:-ifrspro_tenant_iaf} -v ON_ERROR_STOP=1 -f /seeds/003_seed_users.sql;
      "
    networks:
      - ifrs9-dev
    profiles:
      - bootstrap
      - full
      - dev
      - app
      - backend
      - backend-only
      - backend-legacy-vpn

  # ============================================================================
  # 📊 REDIS (Development)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ifrs9-redis-dev
    restart: ${IFRS9_RESTART_POLICY:-no}
    command: redis-server --appendonly yes
    ports:
      - "7379:6379"
    volumes:
      - redis-dev-data:/data
    networks:
      - ifrs9-dev
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - db
      - bootstrap
      - full
      - dev
      - app
      - backend
      - backend-only
      - backend-legacy-vpn
      - backend-vpn
      - backend-remote-db

  # ============================================================================
  # 🚀 NEW BACKEND SERVICE (Hono + Drizzle + Bun)
  # ============================================================================
  new-backend:
    build:
      context: ../../packages/new-backend
      dockerfile: Dockerfile
      target: builder
    container_name: ifrs9-new-backend-dev
    env_file:
      - backend.env
    environment:
      # Only set what needs to be different from .env
      NODE_ENV: development
      PORT: 5232
      HOST: 0.0.0.0
      LOG_LEVEL: debug
      # Redis uses docker service name when running in docker network
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      # R Analytics API URL mapped to docker service
      R_SERVICE_URL: http://r-analytics:4241
    ports:
      - "5232:5232"
    networks:
      - ifrs9-dev
      - ifrs9-observability
    depends_on:
      db-init:
        condition: service_completed_successfully
      platform-init:
        condition: service_completed_successfully
      tenant-seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: ${IFRS9_RESTART_POLICY:-no}
    volumes:
      - ../../packages/new-backend/src:/app/src:ro
      - ../../packages/new-backend/package.json:/app/package.json
      - ../../packages/new-backend/bunfig.toml:/app/bunfig.toml
      - new-backend-node-modules:/app/node_modules
    extra_hosts:
      - "smtp.office365.com:40.99.63.82"

    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://localhost:4232/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
    # Run without watch mode in Docker to prevent EADDRINUSE on reload
    # Source changes will be picked up on container restart
    command: sh -c "bun install && bun run src/index.ts"
    profiles:
      - app
      - full
      - dev
      - backend
      - backend-only

  new-backend-legacy-vpn:
    build:
      context: ../../packages/new-backend
      dockerfile: Dockerfile
      target: builder
    container_name: ifrs9-new-backend-legacy-vpn
    env_file:
      - backend.env
    environment:
      NODE_ENV: development
      PORT: 5232
      HOST: 0.0.0.0
      LOG_LEVEL: debug
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      R_SERVICE_URL: http://r-analytics:4241

      LEGACY_DB_HOST: ${LEGACY_DB_HOST:-10.8.0.2}
      LEGACY_DB_PORT: ${LEGACY_DB_PORT:-5433}
      LEGACY_DB_USER: ${LEGACY_DB_USER:-postgres}
      LEGACY_DB_PASSWORD: ${LEGACY_DB_PASSWORD:-postgres}
      LEGACY_DB_NAME: ${LEGACY_DB_NAME:-FRS9PRO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5232:5232"
    networks:
      - ifrs9-dev
      - ifrs9-observability
    depends_on:
      db-init:
        condition: service_completed_successfully
      platform-init:
        condition: service_completed_successfully
      tenant-seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: ${IFRS9_RESTART_POLICY:-no}
    volumes:
      - ../../packages/new-backend/src:/app/src:ro
      - ../../packages/new-backend/package.json:/app/package.json
      - ../../packages/new-backend/bunfig.toml:/app/bunfig.toml
      - new-backend-node-modules:/app/node_modules
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://localhost:4232/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
    command: sh -c "bun install && bun run src/index.ts"
    profiles:
      - backend-legacy-vpn

  # ============================================================================
  # 🔐 NEW BACKEND (REMOTE DB / EXTERNAL DB)
  # - Use when platform/tenant/legacy DBs are external and must not be migrated/seeded from ops/local.
  # - Run compose with: docker compose --env-file ops/local/backend.env -f ops/local/docker-compose.yml --profile backend-remote-db up
  # - This service intentionally does not depend on postgres/db-init/platform-init/tenant-migrate/tenant-seed.
  # ============================================================================
  new-backend-vpn:
    build:
      context: ../../packages/new-backend
      dockerfile: Dockerfile
      target: builder
    container_name: ifrs9-new-backend-vpn
    environment:
      NODE_ENV: development
      PORT: 5232
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5231,http://127.0.0.1:5231}

      JWT_SECRET: ${JWT_SECRET:-dev-local-jwt-secret-please-change-000000}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-local-jwt-refresh-secret-please-change-000000}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      PLATFORM_DB_HOST: ${PLATFORM_DB_HOST:-${DB_HOST}}
      PLATFORM_DB_PORT: ${PLATFORM_DB_PORT:-${DB_PORT:-5432}}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER:-${DB_USER}}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-${DB_PASSWORD}}
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME:-ifrspro_platform_admin}
      PLATFORM_DB_SSL: ${PLATFORM_DB_SSL:-false}

      TENANT_DB_HOST: ${TENANT_DB_HOST:-${DB_HOST}}
      TENANT_DB_PORT: ${TENANT_DB_PORT:-${DB_PORT:-5432}}
      TENANT_DB_USER: ${TENANT_DB_USER:-${DB_USER}}
      TENANT_DB_PASSWORD: ${TENANT_DB_PASSWORD:-${DB_PASSWORD}}
      TENANT_DB_NAME: ${TENANT_DB_NAME:-ifrspro_tenant_iaf}
      TENANT_DB_SSL: ${TENANT_DB_SSL:-false}

      LEGACY_DB_HOST: ${LEGACY_DB_HOST:-${DB_HOST}}
      LEGACY_DB_PORT: ${LEGACY_DB_PORT:-${DB_PORT:-5432}}
      LEGACY_DB_USER: ${LEGACY_DB_USER:-${DB_USER}}
      LEGACY_DB_PASSWORD: ${LEGACY_DB_PASSWORD:-${DB_PASSWORD}}
      LEGACY_DB_NAME: ${LEGACY_DB_NAME:-FRS9PRO}
      LEGACY_DB_SSL: ${LEGACY_DB_SSL:-false}

      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

      R_SERVICE_URL: ${R_SERVICE_URL:-http://r-analytics:4241}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5232:5232"
    networks:
      - ifrs9-dev
      - ifrs9-observability
    depends_on:
      redis:
        condition: service_healthy
    restart: ${IFRS9_RESTART_POLICY:-no}
    volumes:
      - ../../packages/new-backend/src:/app/src:ro
      - ../../packages/new-backend/package.json:/app/package.json
      - ../../packages/new-backend/bunfig.toml:/app/bunfig.toml
      - new-backend-node-modules:/app/node_modules
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://localhost:4232/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
    command: sh -c "bun install && bun run src/index.ts"
    profiles:
      - backend-vpn
      - backend-remote-db

  # ============================================================================
  # 🌐 FRONTEND SERVICE (Static Build - Optional)
  # ============================================================================
  frontend:
    build:
      context: ../../packages/frontend
      dockerfile: Dockerfile
    container_name: ifrs9-frontend-dev
    env_file:
      - frontend.env.example
    environment:
      NODE_ENV: development
      HOSTNAME: "0.0.0.0"
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://host.docker.internal:5232}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5231:4231"
    networks:
      - ifrs9-dev
      - ifrs9-observability
    profiles:
      - app
      - with-frontend
      - frontend
      - frontend-remote-db

  # ============================================================================
  # 💻 FRONTEND DEVELOPMENT (Hot Reload)
  # ============================================================================
  frontend-dev:
    build:
      context: ../../packages/frontend
      dockerfile: Dockerfile.dev
    container_name: ifrs9-frontend-dev-hot
    env_file:
      - frontend.env.example
    environment:
      - NODE_ENV=development
      - PORT=5231
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://host.docker.internal:5232}
      # Server-side env vars (for Next.js server)
      # Client-side uses .env file which has localhost URLs
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_OPTIONS=--max-old-space-size=4096
      - WSS_PORT=5231
      # Polling is reliable on every Docker setup, but very slow on macOS bind mounts.
      # Override with WATCHPACK_POLLING=true only if file changes are not detected.
      - WATCHPACK_POLLING=${WATCHPACK_POLLING:-false}
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-false}
    volumes:
      - ../../packages/frontend/src:/app/src
      - ../../packages/frontend/public:/app/public
      - ../../packages/frontend/next.config.mjs:/app/next.config.mjs
      - ../../packages/frontend/.env.local:/app/.env.local
      - ../../packages/frontend/package.json:/app/package.json
      - ../../packages/frontend/tsconfig.json:/app/tsconfig.json:ro
      - frontend-next-cache:/app/.next
    ports:
      - "5231:5231"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ifrs9-dev
      - ifrs9-observability
    profiles:
      - dev-frontend
      - hot-reload
      - full
      - frontend-only
      - frontend
      - frontend-remote-db

  # ============================================================================
  # 📘 DOCUMENTATION (Docusaurus)
  # ============================================================================
  docs:
    build:
      context: ../../packages/docs
      dockerfile: Dockerfile
    container_name: ifrs9-docs-dev
    environment:
      NODE_ENV: production
    ports:
      - "5235:3000"
    networks:
      - ifrs9-dev
    profiles:
      - full
      - docs

# ============================================================================
# 📁 VOLUMES
# ============================================================================
volumes:
  postgres-dev-data:
    name: ifrs9-iaf_postgres-dev-data
    driver: local
  redis-dev-data:
    name: ifrs9-iaf_redis-dev-data
    driver: local
  new-backend-node-modules:
    driver: local
  frontend-node-modules:
    driver: local
  frontend-next-cache:
    driver: local
  r-analytics-logs:
    driver: local

# ============================================================================
# 🌐 NETWORKS
# ============================================================================
networks:
  ifrs9-dev:
    driver: bridge
  ifrs9-observability:
    external: true
