# docker-compose.production.yml
# ============================================================================
# 🚀 IFRS9 PLATFORM - PRODUCTION DOCKER COMPOSE
# ============================================================================
# Domain Configuration:
# - Frontend: https://ifrs9.ifrspro.id
# - Backend: https://bifrs9.ifrspro.id
# - R Analytics: https://rifrs9.ifrspro.id
# ============================================================================

version: '3.8'

services:
  # ============================================================================
  # 🌐 NGINX REVERSE PROXY (SSL Termination)
  # ============================================================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/ssl/certs:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
      - r-analytics-proxy
    networks:
      - ifrs9-production
    restart: unless-stopped

  # ============================================================================
  # 📊 BACKEND API SERVICE (bifrs9.ifrspro.id)
  # ============================================================================
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile.production
    environment:
      - NODE_ENV=production
      - PORT=4232
      - HOST=0.0.0.0
      
      # Production URLs
      - FRONTEND_URL=https://ifrs9.ifrspro.id
      - BACKEND_URL=https://bifrs9.ifrspro.id
      - API_BASE_URL=https://bifrs9.ifrspro.id/api
      - RAPI_BASE_URL=https://rifrs9.ifrspro.id/api
      
      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      
      # Database Configuration
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - FRS9_DB_HOST=${FRS9_DB_HOST}
      - FRS9_DB_PORT=${FRS9_DB_PORT}
      - FRS9_DB_USER=${FRS9_DB_USER}
      - FRS9_DB_PASSWORD=${FRS9_DB_PASSWORD}
      
      # R Analytics Configuration
      - R_ANALYTICS_ENABLED=true
      - R_ANALYTICS_DOMAIN=rifrs9.ifrspro.id
      - R_ANALYTICS_PROTOCOL=https
      - R_PORT_RANGE_MIN=4800
      - R_PORT_RANGE_MAX=4900
      
      # CORS Configuration
      - CORS_ORIGINS=https://ifrs9.ifrspro.id,https://bifrs9.ifrspro.id,https://rifrs9.ifrspro.id
      
      # Security Configuration
      - SSL_ENABLED=true
      - HELMET_ENABLED=true
      - RATE_LIMITING_ENABLED=true
      
    expose:
      - "4232"
    depends_on:
      - postgres-ds1
      - redis
    networks:
      - ifrs9-production
    volumes:
      - backend-logs:/var/log/backend
      - r-analytics-logs:/var/log/r-analytics
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4232/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # 🌐 FRONTEND SERVICE (ifrs9.ifrspro.id)
  # ============================================================================
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile.production
      args:
        - NEXT_PUBLIC_API_URL=https://bifrs9.ifrspro.id
        - NEXT_PUBLIC_R_ANALYTICS_BASE_URL=https://rifrs9.ifrspro.id/api
        - NEXT_PUBLIC_ENVIRONMENT=production
    environment:
      - NODE_ENV=production
      - PORT=4231
      - NEXT_PUBLIC_API_URL=https://bifrs9.ifrspro.id
      - NEXT_PUBLIC_R_ANALYTICS_ENABLED=true
      - NEXT_PUBLIC_R_ANALYTICS_BASE_URL=https://rifrs9.ifrspro.id/api
      - NEXT_PUBLIC_DOMAIN=ifrspro.id
    expose:
      - "4231"
    depends_on:
      - backend
    networks:
      - ifrs9-production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4231"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # 🔬 R ANALYTICS PROXY (rifrs9.ifrspro.id)
  # ============================================================================
  r-analytics-proxy:
    build:
      context: ./packages/r-analytics
      dockerfile: Dockerfile.proxy
    environment:
      - NODE_ENV=production
      - PORT=4233
      - R_ANALYTICS_DOMAIN=rifrs9.ifrspro.id
      - BACKEND_URL=https://bifrs9.ifrspro.id
      - JWT_SECRET=${JWT_SECRET}
    expose:
      - "4233"
    networks:
      - ifrs9-production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - r-analytics-logs:/var/log/r-analytics
    restart: unless-stopped

  # ============================================================================
  # 🏦 CONVENTIONAL BANKING R ANALYTICS
  # ============================================================================
  r-analytics-conventional:
    build:
      context: ./packages/r-analytics
      dockerfile: Dockerfile
    environment:
      # Database Connections
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - FRS9_DB_HOST=${FRS9_DB_HOST}
      - FRS9_DB_PORT=${FRS9_DB_PORT}
      - FRS9_DB_USER=${FRS9_DB_USER}
      - FRS9_DB_PASSWORD=${FRS9_DB_PASSWORD}
      
      # Tenant Configuration
      - TENANT_SLUG=demo-conventional
      - BANKING_TYPE=conventional
      - USER_ID=conventional_user
      - USER_EMAIL=conventional@ifrspro.id
      - BANKING_ACCESS=CONVENTIONAL
      - SYARIAH_CERTIFIED=false
      
      # R Runtime Configuration
      - SHINY_HOST=0.0.0.0
      - SHINY_PORT=3838
      - R_LIBS_USER=/opt/r-analytics/R-libs
      
      # Production Configuration
      - NODE_ENV=production
      - R_SESSION_ID=conventional-prod
    expose:
      - "3838"
    networks:
      - ifrs9-production
    volumes:
      - r-analytics-libs:/opt/r-analytics/R-libs
      - r-analytics-logs:/opt/r-analytics/logs
      - r-analytics-temp:/opt/r-analytics/temp
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  # ============================================================================
  # 🕌 SYARIAH BANKING R ANALYTICS
  # ============================================================================
  r-analytics-syariah:
    build:
      context: ./packages/r-analytics
      dockerfile: Dockerfile
    environment:
      # Database Connections
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - FRS9_DB_HOST=${FRS9_DB_HOST}
      - FRS9_DB_PORT=${FRS9_DB_PORT}
      - FRS9_DB_USER=${FRS9_DB_USER}
      - FRS9_DB_PASSWORD=${FRS9_DB_PASSWORD}
      
      # Tenant Configuration
      - TENANT_SLUG=demo-syariah
      - BANKING_TYPE=syariah
      - USER_ID=syariah_user
      - USER_EMAIL=syariah@ifrspro.id
      - BANKING_ACCESS=SYARIAH
      - SYARIAH_CERTIFIED=true
      
      # Islamic Banking Features
      - R_ISLAMIC_MODE=true
      - R_HALAL_SCREENING=true
      - R_SYARIAH_COMPLIANCE=true
      
      # R Runtime Configuration
      - SHINY_HOST=0.0.0.0
      - SHINY_PORT=3838
      - R_LIBS_USER=/opt/r-analytics/R-libs
      
      # Production Configuration
      - NODE_ENV=production
      - R_SESSION_ID=syariah-prod
    expose:
      - "3838"
    networks:
      - ifrs9-production
    volumes:
      - r-analytics-libs:/opt/r-analytics/R-libs
      - r-analytics-logs:/opt/r-analytics/logs
      - r-analytics-temp:/opt/r-analytics/temp
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  # ============================================================================
  # 📊 DANA PRODUCTION R ANALYTICS
  # ============================================================================
  r-analytics-dana:
    build:
      context: ./packages/r-analytics
      dockerfile: Dockerfile
    environment:
      # Database Connections
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - FRS9_DB_HOST=${FRS9_DB_HOST}
      - FRS9_DB_PORT=${FRS9_DB_PORT}
      - FRS9_DB_USER=${FRS9_DB_USER}
      - FRS9_DB_PASSWORD=${FRS9_DB_PASSWORD}
      
      # DANA Production Configuration
      - TENANT_SLUG=dana
      - BANKING_TYPE=conventional
      - USER_ID=dana_prod_user
      - USER_EMAIL=dana@ifrspro.id
      - BANKING_ACCESS=CONVENTIONAL
      - SYARIAH_CERTIFIED=false
      
      # R Runtime Configuration
      - SHINY_HOST=0.0.0.0
      - SHINY_PORT=3838
      - R_LIBS_USER=/opt/r-analytics/R-libs
      
      # Production Configuration
      - NODE_ENV=production
      - R_SESSION_ID=dana-prod
    expose:
      - "3838"
    networks:
      - ifrs9-production
    volumes:
      - r-analytics-libs:/opt/r-analytics/R-libs
      - r-analytics-logs:/opt/r-analytics/logs
      - r-analytics-temp:/opt/r-analytics/temp
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'

  # ============================================================================
  # 🗄️ POSTGRESQL DATABASE (Production)
  # ============================================================================
  postgres-ds1:
    image: postgres:14
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - postgres-production-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
      - postgres-backups:/var/backups/postgresql
    networks:
      - ifrs9-production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # 📊 REDIS (Production)
  # ============================================================================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-production-data:/data
    networks:
      - ifrs9-production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # 📊 MONITORING & LOGGING
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - ifrs9-production
    restart: unless-stopped
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - ifrs9-production
    restart: unless-stopped
    profiles:
      - monitoring

# ============================================================================
# 📁 VOLUMES (Production)
# ============================================================================
volumes:
  postgres-production-data:
    driver: local
  postgres-backups:
    driver: local
  redis-production-data:
    driver: local
  r-analytics-libs:
    driver: local
  r-analytics-logs:
    driver: local
  r-analytics-temp:
    driver: local
  backend-logs:
    driver: local
  nginx-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# ============================================================================
# 🌐 NETWORKS (Production)
# ============================================================================
networks:
  ifrs9-production:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

# ============================================================================
# 🚀 PRODUCTION DEPLOYMENT COMMANDS
# ============================================================================
# Deploy production environment:
# docker-compose -f docker-compose.production.yml up -d
#
# Deploy with monitoring:
# docker-compose -f docker-compose.production.yml --profile monitoring up -d
#
# Scale R Analytics:
# docker-compose -f docker-compose.production.yml up -d --scale r-analytics-conventional=2
#
# Health check:
# docker-compose -f docker-compose.production.yml ps
# ============================================================================