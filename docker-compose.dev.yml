# docker-compose.dev.yml
# ============================================================================
# 🚀 IFRS9 NEW BACKEND - DEVELOPMENT DOCKER COMPOSE
# ============================================================================
# Usage:
#   docker-compose -f docker-compose.dev.yml up -d
#   docker-compose -f docker-compose.dev.yml logs -f new-backend
# ============================================================================

services:
  # ============================================================================
  # 🗄️ POSTGRESQL DATABASE (Development)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ifrs9-postgres-dev
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ifrspro_platform_admin}
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - ifrs9-dev
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 📊 REDIS (Development)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ifrs9-redis-dev
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    networks:
      - ifrs9-dev
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 🚀 NEW BACKEND SERVICE (Hono + Drizzle + Bun)
  # ============================================================================
  new-backend:
    build:
      context: ./packages/new-backend
      dockerfile: Dockerfile
      target: builder
    container_name: ifrs9-new-backend-dev
    environment:
      NODE_ENV: development
      PORT: 4232
      HOST: 0.0.0.0

      # Database
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-ifrspro_platform_admin}

      # JWT
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      JWT_EXPIRES_IN: 1h

      # Redis
      REDIS_URL: redis://redis:6379

      # Logging
      LOG_LEVEL: debug
    ports:
      - "4232:4232"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ifrs9-dev
    volumes:
      - ./packages/new-backend/src:/app/src:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4232/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    # For hot reload during development, uncomment:
    command: [ "bun", "run", "dev" ]
    # ============================================================================
    # 🌐 FRONTEND SERVICE (Optional - can run separately)
    # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: ifrs9-frontend-dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_BACKEND_URL: http://localhost:4232/api
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4232/api
    ports:
      - "4231:4231"
    depends_on:
      - new-backend
    networks:
      - ifrs9-dev
    profiles:
      - with-frontend

# ============================================================================
# 📁 VOLUMES
# ============================================================================
volumes:
  postgres-dev-data:
    driver: local
  redis-dev-data:
    driver: local

# ============================================================================
# 🌐 NETWORKS
# ============================================================================
networks:
  ifrs9-dev:
    driver: bridge

# ============================================================================
# 🚀 DEVELOPMENT COMMANDS
# ============================================================================
# Start backend only (with DB + Redis):
#   docker-compose -f docker-compose.dev.yml up -d
#
# Start with frontend:
#   docker-compose -f docker-compose.dev.yml --profile with-frontend up -d
#
# View logs:
#   docker-compose -f docker-compose.dev.yml logs -f new-backend
#
# Run migrations:
#   docker-compose -f docker-compose.dev.yml exec new-backend bun run db:migrate
#
# Stop all:
#   docker-compose -f docker-compose.dev.yml down
# ============================================================================
