name: Docker Develop Publish

on:
  push:
    branches: ['develop']
    paths:
      - 'packages/frontend/**'
      - 'packages/new-backend/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Development
    # Memaksa menggunakan runner bernama "ristix"
    runs-on: [self-hosted, ristix]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix git safe.directory
        run: git config --global --add safe.directory "${{ github.workspace }}"

      - name: Check for changes
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'packages/frontend/**'
            backend:
              - 'packages/new-backend/**'

      - name: Set services to rebuild
        id: services
        shell: bash
        run: |
          frontend="${{ steps.filter.outputs.frontend }}"
          backend="${{ steps.filter.outputs.backend }}"
          event="${{ github.event_name }}"
          
          services=()
          if [ "$event" == "workflow_dispatch" ]; then
            services=("frontend" "backend")
          else
            if [ "$frontend" == "true" ]; then services+=("frontend"); fi
            if [ "$backend" == "true" ]; then services+=("backend"); fi
          fi
          
          # Join array dengan koma untuk logging
          svc_joined=$(IFS=, ; echo "${services[*]}")
          echo "services=$svc_joined" >> $GITHUB_OUTPUT
          echo "Services to build: $svc_joined"

      - name: Build and Deploy changed services
        shell: bash
        run: |
          services_str="${{ steps.services.outputs.services }}"
          if [ -z "$services_str" ]; then
            echo "No services to rebuild"
            exit 0
          fi
          
          # Ubah koma menjadi spasi untuk argumen docker compose
          services_args=$(echo $services_str | tr ',' ' ')
          
          echo "Rebuilding and deploying: $services_args"
          
          # Eksekusi docker compose (sama persis dengan yang dijalankan manual di server)
          docker compose -f ops/dev/docker-compose.yml up -d --build $services_args
