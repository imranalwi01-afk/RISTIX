name: Docker Develop Publish

on:
  push:
    branches: ['develop']
    paths:
      - 'packages/frontend/**'
      - 'packages/new-backend/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Development
    runs-on: [self-hosted, X64, Windows, badak]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix git safe.directory
        run: git config --global --add safe.directory "${{ github.workspace }}"

      - name: Check for changes
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'packages/frontend/**'
            backend:
              - 'packages/new-backend/**'

      - name: Set services to rebuild
        id: services
        shell: powershell
        run: |
          $frontend = "${{ steps.filter.outputs.frontend }}"
          $backend  = "${{ steps.filter.outputs.backend }}"
          $event    = "${{ github.event_name }}"

          # Dev server uses tag :develop (not :production)
          $services = @()
          if ($event -eq "workflow_dispatch") {
            $services = @("frontend", "backend")
          } else {
            if ($frontend -eq "true")  { $services += "frontend" }
            if ($backend -eq "true")   { $services += "backend" }
          }

          $output = "services=$($services -join ',')"
          Write-Output $output
          Add-Content -Path $env:GITHUB_OUTPUT -Value $output

      - name: Build and Deploy changed services
        shell: powershell
        run: |
          $services = "${{ steps.services.outputs.services }}".Split(',', [StringSplitOptions]::RemoveEmptyEntries)
          if ($services.Count -eq 0) {
            Write-Output "No services to rebuild"
            exit 0
          }
          Write-Output "Rebuilding: $($services -join ', ')"
          $CHECKOUT_DIR = "${{ github.workspace }}"
          $COMPOSE_DIR = "C:\opt\ifrspro"

          foreach ($svc in $services) {
            switch ($svc) {
              "frontend" {
                $tag = "ghcr.io/ifrspro/ifrs9-iaf/frontend:develop"
                $ctx = "$CHECKOUT_DIR/packages/frontend"
                $df = "$CHECKOUT_DIR/packages/frontend/Dockerfile"
              }
              "backend" {
                $tag = "ghcr.io/ifrspro/ifrs9-iaf/backend:develop"
                $ctx = "$CHECKOUT_DIR/packages/new-backend"
                $df = "$CHECKOUT_DIR/packages/new-backend/Dockerfile"
              }
            }
            Write-Output "Building $svc -> $tag"
            docker build -t $tag -f $df $ctx
            if ($LASTEXITCODE -ne 0) { throw "Build failed for $svc" }
          }

          Set-Location $COMPOSE_DIR
          # Restart backend first (if changed), wait, then frontend
          if ($services -contains "backend") {
            Write-Output "Restarting backend..."
            docker compose up -d --force-recreate --no-deps backend
            Write-Output "Waiting 15s for backend to start..."
            Start-Sleep 15
          }
          if ($services -contains "frontend") {
            Write-Output "Restarting frontend..."
            docker compose up -d --force-recreate --no-deps frontend
          }
