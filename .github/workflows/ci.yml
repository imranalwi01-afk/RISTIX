name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('packages/new-backend/pnpm-lock.yaml', 'packages/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install backend dependencies
        run: |
          cd packages/new-backend
          pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        run: |
          cd packages/frontend
          pnpm install --frozen-lockfile

      - name: Type-check Backend
        run: cd packages/new-backend && pnpm run typecheck

      - name: Type-check Frontend
        run: cd packages/frontend && pnpm run type-check

      - name: Lint Frontend
        continue-on-error: true
        run: cd packages/frontend && pnpm run lint

      - name: Backend Unit Tests
        run: cd packages/new-backend && JWT_SECRET=ci-test-jwt-secret-min-32-chars-long!! pnpm run test:unit
