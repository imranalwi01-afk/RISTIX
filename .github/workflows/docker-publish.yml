name: Docker Publish

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==============================================================================
  # FRONTEND BUILD JOB
  # ==============================================================================
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Intelligent Path Filter
      - name: Check for changes in Frontend
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'packages/frontend/**'
              - '.github/workflows/docker-publish.yml'

      # Skip if no changes and not a tag release
      - name: Login to Container Registry
        if: steps.filter.outputs.frontend == 'true' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels)
        if: steps.filter.outputs.frontend == 'true' || startsWith(github.ref, 'refs/tags/')
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Set up Docker Buildx
        if: steps.filter.outputs.frontend == 'true' || startsWith(github.ref, 'refs/tags/')
        uses: docker/setup-buildx-action@v3

      - name: Build and Push (Frontend)
        if: steps.filter.outputs.frontend == 'true' || startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v5
        with:
          context: packages/frontend
          file: packages/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_ENVIRONMENT=development
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_BACKEND_API_URL=${{ vars.NEXT_PUBLIC_BACKEND_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_R_ANALYTICS_URL=${{ vars.NEXT_PUBLIC_R_ANALYTICS_URL }}
            NEXT_PUBLIC_R_ANALYTICS_BASE_URL=${{ vars.NEXT_PUBLIC_R_ANALYTICS_BASE_URL }}
            NEXT_PUBLIC_RAPI_BASE_URL=${{ vars.NEXT_PUBLIC_RAPI_BASE_URL }}
            NEXT_PUBLIC_DOMAIN=${{ vars.NEXT_PUBLIC_DOMAIN }}
            NEXT_PUBLIC_APP_NAME=${{ vars.NEXT_PUBLIC_APP_NAME }}
          cache-from: type=gha

          cache-to: type=gha,mode=max

  # ==============================================================================
  # BACKEND BUILD JOB
  # ==============================================================================
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Intelligent Path Filter
      - name: Check for changes in Backend
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'packages/new-backend/**'
              - '.github/workflows/docker-publish.yml'

      # Skip if no changes and not a tag release
      - name: Login to Container Registry
        if: steps.filter.outputs.backend == 'true' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels)
        if: steps.filter.outputs.backend == 'true' || startsWith(github.ref, 'refs/tags/')
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Set up Docker Buildx
        if: steps.filter.outputs.backend == 'true' || startsWith(github.ref, 'refs/tags/')
        uses: docker/setup-buildx-action@v3

      - name: Build and Push (Backend)
        if: steps.filter.outputs.backend == 'true' || startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v5
        with:
          # Context is the package directory because it's self-contained
          context: packages/new-backend
          file: packages/new-backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
