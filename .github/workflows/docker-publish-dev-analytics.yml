name: Docker Analytics Develop Publish

on:
  push:
    branches: ['develop']
    paths:
      - 'packages/r-analytics/**'
      - '!packages/r-analytics/Dockerfile.base'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Analytics to Development
    runs-on: [self-hosted, X64, Windows, badak]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix git safe.directory
        run: git config --global --add safe.directory "${{ github.workspace }}"

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and Deploy R Analytics
        shell: powershell
        run: |
          $CHECKOUT_DIR = "${{ github.workspace }}"
          $COMPOSE_DIR = "C:\opt\ifrspro"
          $tag = "ghcr.io/ifrspro/ifrs9-iaf/r-analytics:production"

          Write-Output "Building r-analytics -> $tag"
          docker build -t $tag -f "$CHECKOUT_DIR/packages/r-analytics/Dockerfile" "$CHECKOUT_DIR/packages/r-analytics"
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

          Set-Location $COMPOSE_DIR
          Write-Output "Restarting r-analytics"
          docker compose up -d --no-deps r-analytics
