name: Docker Analytics Develop Publish

on:
  push:
    branches: [ 'develop' ]
    paths:
      - 'packages/r-analytics/**'
      - '!packages/r-analytics/Dockerfile.base'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==============================================================================
  # R ANALYTICS BUILD JOB
  # Base image is built separately in docker-publish-dev-analytics-base.yml
  # Run that workflow manually when Dockerfile.base changes.
  # ==============================================================================
  analytics:
    name: Build R Analytics Image
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.analytics }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for changes in Analytics
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            analytics:
              - 'packages/r-analytics/**'
              - '!packages/r-analytics/Dockerfile.base'

      - name: Login to Container Registry
        if: steps.filter.outputs.analytics == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels)
        if: steps.filter.outputs.analytics == 'true' || github.event_name == 'workflow_dispatch'
        id: meta-analytics
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/r-analytics
          tags: |
            type=raw,value=develop
            type=sha,format=long

      - name: Set up Docker Buildx
        if: steps.filter.outputs.analytics == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Build and Push (R Analytics)
        if: steps.filter.outputs.analytics == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: packages/r-analytics
          file: packages/r-analytics/Dockerfile
          push: true
          tags: ${{ steps.meta-analytics.outputs.tags }}
          labels: ${{ steps.meta-analytics.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================================================
  # DEPLOY TO DEVELOPMENT (SELF-HOSTED WINDOWS RUNNER)
  # ==============================================================================
  deploy:
    name: Deploy Analytics to Development Server
    runs-on: [self-hosted, X64, Windows, badak]
    needs: [analytics]

    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Deploy analytics profile
        if: needs.analytics.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cd C:\opt\ifrspro
          docker compose --profile analytics pull
          docker compose --profile analytics up -d --force-recreate r-analytics
