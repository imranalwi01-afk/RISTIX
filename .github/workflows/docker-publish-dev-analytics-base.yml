name: Docker Analytics Base Image

# ============================================================================
# This workflow is SEPARATE from the main analytics workflow.
# It only needs to run when Dockerfile.base changes (very rarely).
# Trigger manually when you update R packages or the base OS layer.
# ============================================================================

on:
  push:
    branches: ['develop']
    paths:
      - 'packages/r-analytics/Dockerfile.base'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  r-analytics-base:
    name: Build R Analytics Base Image
    runs-on: [self-hosted, X64, Windows, badak]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push (R Analytics Base)
        uses: docker/build-push-action@v5
        with:
          context: packages/r-analytics
          file: packages/r-analytics/Dockerfile.base
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/r-analytics-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min
