name: Docker Analytics Base Image

# ============================================================================
# This workflow is SEPARATE from the main analytics workflow.
# It only needs to run when Dockerfile.base changes (very rarely).
# Trigger manually when you update R packages or the base OS layer.
# ============================================================================

on:
  push:
    branches: [ 'develop' ]
    paths:
      - 'packages/r-analytics/Dockerfile.base'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # R ANALYTICS BASE IMAGE BUILD
  # ============================================================================
  r-analytics-base:
    name: Build R Analytics Base Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels)
        id: meta-r-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/r-analytics-base
          tags: |
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push (R Analytics Base)
        uses: docker/build-push-action@v5
        with:
          context: packages/r-analytics
          file: packages/r-analytics/Dockerfile.base
          push: true
          tags: ${{ steps.meta-r-base.outputs.tags }}
          labels: ${{ steps.meta-r-base.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
