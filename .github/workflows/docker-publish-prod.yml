name: Docker Production Publish

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      seed_menu:
        description: 'Run menu seed against production DB (one-time, idempotent)'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =============================================================================
  # TEST & QUALITY GATE (skip when only running seed)
  # =============================================================================
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install backend dependencies
        run: |
          cd packages/new-backend
          pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        run: |
          cd packages/frontend
          pnpm install --frozen-lockfile

      - name: Type-check Backend
        run: cd packages/new-backend && pnpm run typecheck

      - name: Type-check Frontend
        run: cd packages/frontend && pnpm run type-check

      - name: Backend Unit Tests
        run: cd packages/new-backend && JWT_SECRET=ci-test-jwt-secret-min-32-chars-long!! pnpm run test:unit

  # =============================================================================
  # 🌱 SEED MENU (workflow_dispatch only – one-time, idempotent)
  # =============================================================================
  seed-menu:
    name: Seed Menu (Production)
    if: github.event_name == 'workflow_dispatch' && inputs.seed_menu
    runs-on: [self-hosted, X64, Linux, iaf-prod]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run menu seed SQL
        run: |
          set -euo pipefail

          # Load DB connection from prod backend env
          set -a
          source /opt/ifrspro/ops/prod/env/backend.env
          set +a

          # Extract connection params from DATABASE_URL if individual vars not set
          if [ -n "${DATABASE_URL:-}" ] && [ -z "${DB_HOST:-}" ]; then
            DB_HOST=$(echo "$DATABASE_URL" | sed -n 's|.*@\([^:]*\):.*|\1|p')
            DB_PORT=$(echo "$DATABASE_URL" | sed -n 's|.*:\([0-9]*\)/.*|\1|p')
            DB_NAME=$(echo "$DATABASE_URL" | sed -n 's|.*/\([^?]*\).*|\1|p')
            DB_USER=$(echo "$DATABASE_URL" | sed -n 's|.*://\([^:]*\):.*|\1|p')
            PGPASSWORD=$(echo "$DATABASE_URL" | sed -n 's|.*://[^:]*:\([^@]*\)@.*|\1|p')
            export PGPASSWORD
          fi

          echo "🌱 Seeding menus on ${DB_HOST:-localhost}:${DB_PORT:-5432}/${DB_NAME:-ifrspro_platform_admin}..."

          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/packages/new-backend/src/db/seeds/002_seed_menus.sql:/seed.sql:ro" \
            postgres:16-alpine \
            psql -h "${DB_HOST:-localhost}" -p "${DB_PORT:-5432}" -U "${DB_USER:-postgres}" -d "${DB_NAME:-ifrspro_platform_admin}" -v ON_ERROR_STOP=1 -f /seed.sql

          echo "✅ Menu seed completed successfully!"

  # ==============================================================================
  # FRONTEND BUILD JOB
  # ==============================================================================
  frontend:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push (Frontend)
        uses: docker/build-push-action@v5
        with:
          context: packages/frontend
          file: packages/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_ENVIRONMENT=production
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://iaf-ifrs-be.danafin.com/api' }}
            NEXT_PUBLIC_BACKEND_API_URL=${{ vars.NEXT_PUBLIC_BACKEND_API_URL || 'https://iaf-ifrs-be.danafin.com/api' }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL || 'https://iaf-ifrs-be.danafin.com' }}
            NEXT_PUBLIC_R_ANALYTICS_URL=${{ vars.NEXT_PUBLIC_R_ANALYTICS_URL || 'https://iaf-ifrs-analytics.danafin.com' }}
            NEXT_PUBLIC_R_ANALYTICS_BASE_URL=${{ vars.NEXT_PUBLIC_R_ANALYTICS_BASE_URL || 'https://iaf-ifrs-analytics.danafin.com' }}
            NEXT_PUBLIC_RAPI_BASE_URL=${{ vars.NEXT_PUBLIC_RAPI_BASE_URL || 'https://iaf-ifrs-analytics-calc.danafin.com/api' }}
            NEXT_PUBLIC_DOMAIN=${{ vars.NEXT_PUBLIC_DOMAIN || 'danafin' }}
            NEXT_PUBLIC_APP_NAME=${{ vars.NEXT_PUBLIC_APP_NAME || 'IFRS9 Platform' }}
          cache-from: type=gha

          cache-to: type=gha,mode=min

  # ==============================================================================
  # BACKEND BUILD JOB
  # ==============================================================================
  backend:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push (Backend)
        uses: docker/build-push-action@v5
        with:
          context: packages/new-backend
          file: packages/new-backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
  # ==============================================================================
  # DEPLOY TO PRODUCTION (SELF-HOSTED RUNNER)
  # ==============================================================================
  deploy:
    name: Deploy to Production Server
    if: github.event_name != 'workflow_dispatch'
    runs-on: [self-hosted, X64, Linux, iaf-prod]
    needs: [frontend, backend]

    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
            -u ${{ github.actor }} --password-stdin

      - name: Deploy with Docker Compose
        run: |
          cd /opt/ifrspro
          docker compose --profile app pull
          docker compose --profile app up -d
