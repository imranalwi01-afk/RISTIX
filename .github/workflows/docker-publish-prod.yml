name: Docker Production Publish

on:
  push:
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==============================================================================
  # FRONTEND BUILD JOB
  # ==============================================================================
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push (Frontend)
        uses: docker/build-push-action@v5
        with:
          context: packages/frontend
          file: packages/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_ENVIRONMENT=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================================================
  # BACKEND BUILD JOB
  # ==============================================================================
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push (Backend)
        uses: docker/build-push-action@v5
        with:
          context: packages/new-backend
          file: packages/new-backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # ==============================================================================
  # DEPLOY TO PRODUCTION (SELF-HOSTED RUNNER)
  # ==============================================================================
  deploy:
    name: Deploy to Production Server
    runs-on: [self-hosted, linux, vpn]
    needs: [frontend, backend]

    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
            -u ${{ github.actor }} --password-stdin

      # -----------------------------
      # FRONTEND
      # -----------------------------
      - name: Pull frontend image
        run: |
          docker pull ghcr.io/${{ github.repository }}/frontend:production

      - name: Restart frontend container
        run: |
          docker stop frontend || true
          docker rm frontend || true
          docker run -d \
            --name frontend \
            -p 4231:3000 \
            --restart unless-stopped \
            ghcr.io/${{ github.repository }}/frontend:production

      # -----------------------------
      # BACKEND
      # -----------------------------
      - name: Pull backend image
        run: |
          docker pull ghcr.io/${{ github.repository }}/backend:production

      - name: Restart backend container
        run: |
          docker stop backend || true
          docker rm backend || true
          docker run -d \
            --name backend \
            -p 4232:8080 \
            --env-file /opt/env/backend.env \
            --restart unless-stopped \
            ghcr.io/${{ github.repository }}/backend:production
