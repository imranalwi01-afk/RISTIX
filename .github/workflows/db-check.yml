name: Database Health Check

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Database to check'
        required: true
        default: 'platform'
        type: choice
        options:
          - platform
          - tenant
          - legacy
          - all
      host:
        description: 'Database host'
        required: false
        default: '10.8.0.2'
      port:
        description: 'Database port'
        required: false
        default: '5433'
      tenant_slug:
        description: 'Tenant slug (default: iaf)'
        required: false
        default: 'iaf'

jobs:
  db-check:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Check Platform DB
        if: inputs.target == 'platform' || inputs.target == 'all'
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD || 'postgres' }}
        run: |
          echo "=== Platform Database (ifrspro_platform_admin) ==="
          psql -h ${{ inputs.host }} -p ${{ inputs.port }} -U postgres -d ifrspro_platform_admin -c "
            SELECT 'Tables' as check_name, COUNT(*)::text as status FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog','information_schema')
            UNION ALL
            SELECT 'Menu Categories', COUNT(*)::text FROM menu.menu_categories
            UNION ALL
            SELECT 'Menu Items', COUNT(*)::text FROM menu.menu_items
            UNION ALL
            SELECT 'Menu Permissions', COUNT(*)::text FROM menu.menu_permissions
            UNION ALL
            SELECT 'Users', COUNT(*)::text FROM core.users
            UNION ALL
            SELECT 'Roles', COUNT(*)::text FROM core.roles
            ORDER BY 1;
          "
          echo ""
          echo "=== Menu by Tenant ==="
          psql -h ${{ inputs.host }} -p ${{ inputs.port }} -U postgres -d ifrspro_platform_admin -c "
            SELECT t.code as tenant, t.name, mc.cats, mi.items
            FROM platform_admin.tenants t
            LEFT JOIN (SELECT tenant_id, COUNT(*) as cats FROM menu.menu_categories GROUP BY tenant_id) mc ON mc.tenant_id = t.id
            LEFT JOIN (SELECT tenant_id, COUNT(*) as items FROM menu.menu_items GROUP BY tenant_id) mi ON mi.tenant_id = t.id
            ORDER BY t.code;
          "

      - name: Check Tenant DB
        if: inputs.target == 'tenant' || inputs.target == 'all'
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD || 'postgres' }}
        run: |
          echo "=== Tenant Database (ifrspro_tenant_${{ inputs.tenant_slug }}) ==="
          psql -h ${{ inputs.host }} -p ${{ inputs.port }} -U postgres -d ifrspro_tenant_${{ inputs.tenant_slug }} -c "
            SELECT 'Tables' as check_name, COUNT(*)::text FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog','information_schema')
            UNION ALL
            SELECT 'Approval Requests', COUNT(*)::text FROM approval.approval_requests
            UNION ALL
            SELECT 'Approval Matrices', COUNT(*)::text FROM approval.approval_matrices
            ORDER BY 1;
          "

      - name: Check Legacy DB
        if: inputs.target == 'legacy' || inputs.target == 'all'
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD || 'postgres' }}
        run: |
          echo "=== Legacy Database (FRS9PRO) ==="
          psql -h ${{ inputs.host }} -p ${{ inputs.port }} -U postgres -d FRS9PRO -c "
            SELECT schemaname || '.' || tablename as tables FROM pg_catalog.pg_tables WHERE schemaname NOT IN ('pg_catalog','information_schema') ORDER BY 1 LIMIT 20;
          "

      - name: Verify Menu Seed
        if: inputs.target == 'platform' || inputs.target == 'all'
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD || 'postgres' }}
        run: |
          echo "=== Verify Menu Data (${{ inputs.tenant_slug }}) ==="
          psql -h ${{ inputs.host }} -p ${{ inputs.port }} -U postgres -d ifrspro_platform_admin -c "
            SELECT mc.name as category, COUNT(mi.id) as items
            FROM menu.menu_categories mc
            LEFT JOIN menu.menu_items mi ON mi.category_id = mc.id
            WHERE mc.tenant_id = (SELECT id FROM platform_admin.tenants WHERE slug = '${{ inputs.tenant_slug }}')
            GROUP BY mc.name, mc.sort_order
            ORDER BY mc.sort_order;
          "

      - name: Summary
        if: always()
        run: |
          echo "✅ DB check completed for: ${{ inputs.target }}"
          echo "Host: ${{ inputs.host }}:${{ inputs.port }}"
          echo "Tenant: ${{ inputs.tenant_slug }}"
